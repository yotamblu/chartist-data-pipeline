name: Nightly Data Ingestion

on:
  # schedule disabled -- job must not run automatically until re-enabled.
  # - cron: '30 2 * * *'   # 02:30 UTC daily = 9:30 PM ET (EST) / 8:30 PM ET (EDT)
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab for testing

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python main.py
