name: Nightly Ingestion

on:
  schedule:
    # 02:00 UTC, Tuesday-Saturday. This is always after 9pm US/Eastern for the
    # preceding weekday (Mon-Fri), whether Eastern is on EST (UTC-5, 9pm ET =
    # 02:00 UTC) or EDT (UTC-4, 9pm ET = 01:00 UTC) -- 02:00 UTC is safely
    # after market close either way. main.py itself checks the NYSE calendar
    # and exits cleanly on non-trading days (holidays, etc).
    - cron: "0 2 * * 2-6"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python main.py
